services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: siegpu
      POSTGRES_USER: siegpu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siegpu -d siegpu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://siegpu:${DB_PASSWORD:-pw}@db:5432/siegpu
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      # 智能助手（对话大脑）：DeepSeek API key 只走环境变量，在项目根 .env 配置
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-deepseek-chat}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
